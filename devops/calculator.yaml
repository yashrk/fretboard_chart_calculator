apiVersion: apps/v1
kind: Deployment
metadata:
  name: fretboard-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fretboard-calculator
  template:
    metadata:
      labels:
        app: fretboard-calculator
    spec:
      securityContext:
        fsGroup: 65534
      containers:
      - name: fretboard-calculator
        image: yashrk-docker-registry.registry.twcstorage.ru/yashrk/fretboard-calculator:latest
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: phoenix-secret
              key: secret-key-base
        - name: SITE_ENCRYPT_DB
          value: /mnt/data/site_encrypt_db
        - name: CERT_MODE
          value: production
        ports:
        - protocol: TCP
          containerPort: 4000
          hostPort: 80
        - protocol: TCP
          containerPort: 4040
          hostPort: 443
        volumeMounts:
        - name: calculator-storage
          mountPath: /mnt/data
      imagePullSecrets:
      - name: craas-yashrk-docker-registry
      volumes:
      - name: calculator-storage
        persistentVolumeClaim:
          claimName: calculator-storage-pvc
