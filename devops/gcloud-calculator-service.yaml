apiVersion: v1
kind: Service
metadata:
  name: fretboard-calculator-service
spec:
  selector:
    app: fretboard-calculator
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 4040
  type: LoadBalancer
